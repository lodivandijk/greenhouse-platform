spring:
  mail:
    host: ${GREENHOUSE_SMTP_HOST:}
    port: ${GREENHOUSE_SMTP_PORT:587}
    username: ${GREENHOUSE_SMTP_USERNAME:}
    password: ${GREENHOUSE_SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

greenhouse:
  twin:
    greenhouse-id: greenhouse-01
    greenhouse-name: Home Greenhouse
    current-threshold: 2m
    offline-threshold: 5m
    environmental-limits:
      minimum-temperature-celsius: 5.0
      maximum-temperature-celsius: 35.0
      minimum-humidity-percent: 25.0
      maximum-humidity-percent: 90.0
    zones:
      - zone-id: zone-main
        name: Main Greenhouse
        device-ids:
          - greenhouse-esp32-01

  soil-sensors:
    # dry-raw-adc/wet-raw-adc are calibration reference points, measured
    # 2026-08-29: each probe held stable in air, then fully immersed in
    # water, for several minutes each with readings confirmed steady before
    # recording. Higher raw ADC = drier, confirmed empirically across all
    # five sensors. No moisture percentage is computed from these anywhere
    # yet - see ADR-020.
    assignments:
      - sensor-id: soil-01
        plant: Basil
        dry-raw-adc: 2814
        wet-raw-adc: 1181
      - sensor-id: soil-02
        plant: Thyme
        dry-raw-adc: 2706
        wet-raw-adc: 1121
      - sensor-id: soil-03
        plant: Mint
        dry-raw-adc: 2707
        wet-raw-adc: 1105
      - sensor-id: soil-04
        plant: Sage
        dry-raw-adc: 2794
        wet-raw-adc: 1179
      - sensor-id: soil-05
        plant: Oregano
        dry-raw-adc: 2717
        wet-raw-adc: 1134

  evaluation:
    enabled: true
    interval: PT1M
    initial-delay: PT10S

  # Outcome evaluation windows are hours-scale and per-execution, so this runs
  # on its own slower cadence rather than the one-minute assessment tick.
  outcome-evaluation:
    enabled: true
    interval: PT5M
    initial-delay: PT30S

  daily-briefing:
    enabled: true
    zone: Europe/London
    generate-at: "06:00"
    window: PT24H

  # Outbound notification. Email is OFF by default: the platform runs perfectly
  # well without SMTP configured, and nothing is ever sent until it is switched
  # on deliberately with credentials supplied through the environment.
  notifications:
    enabled: true
    sweep-interval: PT5M
    initial-delay: PT45S
    reminder-interval: PT12H
    recovery-email-enabled: false
    max-delivery-attempts: 6
    channels:
      email:
        enabled: ${GREENHOUSE_EMAIL_ENABLED:false}
        from: ${GREENHOUSE_EMAIL_FROM:}
        to: ${GREENHOUSE_EMAIL_TO:lodi.van.dijk@gmail.com}
        message-id-domain: ${GREENHOUSE_EMAIL_MESSAGE_ID_DOMAIN:greenhouse.local}

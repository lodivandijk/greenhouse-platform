greenhouse:
  twin:
    greenhouse-id: greenhouse-01
    greenhouse-name: Home Greenhouse
    current-threshold: 2m
    offline-threshold: 5m
    environmental-limits:
      minimum-temperature-celsius: 5.0
      maximum-temperature-celsius: 35.0
      minimum-humidity-percent: 25.0
      maximum-humidity-percent: 90.0
    zones:
      - zone-id: zone-main
        name: Main Greenhouse
        device-ids:
          - greenhouse-esp32-01

  soil-sensors:
    assignments:
      - sensor-id: soil-01
        plant: Basil
      - sensor-id: soil-02
        plant: Thyme
      - sensor-id: soil-03
        plant: Mint
      - sensor-id: soil-04
        plant: Sage
      - sensor-id: soil-05
        plant: Oregano

  evaluation:
    enabled: true
    interval: PT1M
    initial-delay: PT10S

spring.application.name=greenhouse-platform

server.address=0.0.0.0
server.port=8080
server.mime-mappings.webmanifest=application/manifest+json

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# The mail starter registers a health indicator that opens an SMTP connection on
# every health check. That is wrong for this platform in both directions: with
# email deliberately disabled it reports DOWN for a feature that is off, and
# with email enabled an SMTP outage would mark the greenhouse unhealthy and
# block a deployment cutover. Notification is a projection whose failure must
# not affect anything else (ADR-023); its real observability is the delivery
# event history and the greenhouse.notifications.* counters.
management.health.mail.enabled=false

info.app.name=Greenhouse Platform
info.app.version=0.1.0

spring.datasource.url=jdbc:postgresql://localhost:5432/greenhouse
spring.datasource.username=greenhouse_app
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

greenhouse.mcp.auth-token=${GREENHOUSE_MCP_AUTH_TOKEN:}
